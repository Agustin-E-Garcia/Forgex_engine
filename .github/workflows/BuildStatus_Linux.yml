name: Build Status (Linux)

on:
  workflow_dispatch:
  push:
    branches:
          main

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libglew-dev libglfw3-dev libgl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGENERATE_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --config Release --verbose
